# CI run marker v2
name: hard-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision cosign (Test 19)
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/cosign.exe" https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe
          curl -fsSL -o "$HOME/bin/opa.exe" https://github.com/open-policy-agent/opa/releases/latest/download/opa_windows_amd64.exe
          "$HOME/bin/cosign.exe" version
          "$HOME/bin/opa.exe" version
      - name: Regenerate baseline (fresh CI, self-consistent)
        shell: bash
        run: bash ben-mode/scripts/refresh-baseline.sh . ben-mode
      - name: HARD GATE #10
        shell: bash
        run: bash ben-mode/scripts/verify-hard-gate.sh .
      - name: Negative / adversarial suite
        shell: bash
        run: bash ben-mode/scripts/test-hard-gate-negative.sh
      - name: TDD RED→GREEN
        shell: bash
        run: bash ben-mode/scripts/tdd-red-green.sh
      - name: Runtime gate fixtures
        shell: bash
        run: |
          python ben-mode/scripts/runtime_gate.py ben-mode/scripts/fixtures/clean.jsonl
          python ben-mode/scripts/runtime_gate.py ben-mode/scripts/fixtures/inject.jsonl && exit 1 || true
          python ben-mode/scripts/runtime_gate.py ben-mode/scripts/fixtures/multi_inject.jsonl && exit 1 || true
          python ben-mode/scripts/runtime_gate.py ben-mode/scripts/fixtures/secret.jsonl && exit 1 || true
      - name: Incremental gate smoke (E1)
        shell: bash
        run: |
          bash ben-mode/scripts/verify-incremental.sh .
          OUT=$(bash ben-mode/scripts/verify-incremental.sh .)
          echo "$OUT" | grep -q "quick PASS" || { echo "expected quick PASS"; exit 1; }
      - name: Telemetry record assert (C1/E2)
        shell: bash
        run: |
          python -c "import json; d=[json.loads(l) for l in open('.hard-gate-meta/gate-time.jsonl') if l.strip()]; r=d[-1]; assert 'catalogs' in r and 'files' in r and 'skills' in r and 'status' in r, r; print('telemetry ok', r)"
      - name: Full-tree verifier smoke (quorum tool)
        shell: bash
        run: |
          python ben-mode/scripts/verify_skill_replicas.py --root ben-mode --replica ben-mode && exit 0 || true
      - name: Unit tests (toolchain; P7-H#1)
        shell: bash
        run: |
          python ben-mode/scripts/tests/test_toolchain.py
      - name: Status matrix + self-BOM (P7-J)
        shell: bash
        run: |
          python ben-mode/scripts/status-matrix.py | python -c "import json,sys; m=json.load(sys.stdin); assert not m['bom_missing']; assert m['negative_test_count']>=16; print('status ok, tests=', m['negative_test_count'])"
      - name: Routing health (P9-S#5)
        shell: bash
        run: |
          python ben-mode/scripts/routing-health.py --ci-smoke
      - name: Regression oracle baseline (P9-S#6)
        shell: bash
        run: |
          python ben-mode/scripts/regression-oracle.py --accept
      - name: OPA provisioning + Rego enforcement (P9-Q#1 / P10-V#1)
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/opa.exe" https://github.com/open-policy-agent/opa/releases/latest/download/opa_windows_amd64.exe
          curl -fsSL -o "$HOME/bin/cosign.exe" https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe
          OPA_BIN="$HOME/bin/opa.exe" python ben-mode/scripts/opa-policy-check.py
          "$HOME/bin/cosign.exe" version || echo "cosign provision warning"
          python ben-mode/scripts/sigstore-verify.py || echo "sigstore-verify: not provisioned in CI (honest)"
      - name: Manifest artifact provenance attestation (P12-D#9)
        shell: bash
        run: |
          bash ben-mode/scripts/sigstore-pipeline.sh "$PWD"
      - name: SBOM required (P10-W#3)
        shell: bash
        run: |
          test -f .hard-gate-meta/ben-mode.sbom.json && echo "sbom present" || { echo "sbom missing"; exit 1; }
      - name: Fresh-machine reproducibility (P8-N#4)
        shell: bash
        run: |
          bash ben-mode/scripts/verify-fresh-machine.sh ben-mode
  fresh-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-machine reproducibility (Linux cross-OS, P10-Y#8)
        shell: bash
        run: |
          bash ben-mode/scripts/verify-fresh-machine.sh ben-mode

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      id-token: write
      pages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dashboard (P13-D1/D2) — sanitized, dashboard only
        run: |
          mkdir -p public
          python ben-mode/scripts/generate-dashboard.py "$PWD/.hard-gate-meta" "public/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  keyless-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Keyless attestation (P14-A3) — OIDC via GH Actions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ben-mode/scripts/sigstore-pipeline.sh
          predicate-type: "https://in-toto.io/Statement/v0.1"
      - name: Verify keyless attestation (P14-C2, gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify ben-mode/scripts/sigstore-pipeline.sh --owner "${{ github.repository_owner }}"
