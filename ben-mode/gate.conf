# gate.conf — P8-M#2: single configuration knob for HARD GATE #10 optional predicates.
# Auto-sourced by verify-hard-gate.sh when present here (skill root) or when
# HARD_GATE_RC points to this file. Only export statements; keep values commented
# unless you intend to enable the feature.

# ROOTS override (newline-separated). If unset, gate falls back to args/default.
# export HARD_GATE_ROOTS="C:/Users/AMMAR/Hermes Agents/Projects/ultimate-skill-catalog"

# Required: CycloneDX SBOM in each root's meta dir (default ON, P10-W#3).
export HARD_GATE_SBOM_REQ=1

# Optional: verify allowlist Ed25519 signature with this public key (path).
# export HARD_GATE_ALLOWLIST_PUB=C:/path/to/pub.pem

# Optional: verify allowlist as W3C VC with this public key (path).
# export HARD_GATE_VC_PUB=C:/path/to/vc-pub.pem

# Optional: enforce model-asset signing (requires <meta>/model-hashes.json), 0/1.
export HARD_GATE_MODEL_SIGNED=1

# Optional: budget hard-stop (windowed token_proxy ceiling), default enabled.
export HARD_GATE_BUDGET=1000000
export HARD_GATE_BUDGET_WINDOW=7

# Optional: fresh-machine reproducibility (two clean bit-identical builds) in deep mode.
# Default ON (P23-A2): deep benctl runs must include fresh-machine, not silently skip.
export HARD_GATE_FRESH=1
